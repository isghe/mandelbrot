<!DOCTYPE html>
<!-- Copyright (c) 2026 Isidoro Ghezzi -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Real-time WebGPU Mandelbrot/Julia fractal renderer with deep zoom (double-single precision) and interactive Julia mode.">
<meta name="author" content="Isidoro Ghezzi">
<title>WebGPU Fractal (big-float)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="gfx"></canvas>
<div id="selectionBox"></div>

<div id="ui">
  <label>Iterations: <span id="iterLabel">300</span></label>
  <input type="range" id="iterSlider" min="50" max="3000" value="300">

  <label>Zoom: <span id="zoomLabel">3.0</span></label>
  <input type="range" id="zoomSlider" min="0.0000001" max="4.0" step="0.0000001" value="3.0">

  <label>Palette:</label>
  <select id="paletteType">
    <option value="0">Viridis</option>
    <option value="1">Fire</option>
    <option value="2">Ocean</option>
    <option value="3">Rainbow</option>
    <option value="4" selected>Apple II</option>
  </select>

  <label><input type="checkbox" id="juliaMode"> Julia mode</label>

  <label><input type="checkbox" id="progressiveMode"> Progressive mode</label>
</div>

<script type="module" src="mandelbrot.js"></script>
</body>
</html>
