<!DOCTYPE html>
<!-- Copyright (c) 2026 Isidoro Ghezzi -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Real-time WebGPU Mandelbrot/Julia fractal renderer with deep zoom (double-single precision) and interactive Julia mode.">
<meta name="author" content="Isidoro Ghezzi">
<title>WebGPU Mandelbrot / Julia Fractal (deep zoom)</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/mandelbrot.png" type="image/png">
</head>
<body>

<canvas id="gfx"></canvas>
<canvas id="overlay"></canvas>
<canvas id="gfxJulia"></canvas>
<canvas id="overlayJulia"></canvas>
<div id="noVizMessage">No visualization mode selected</div>
<div id="selectionBox"></div>
<div id="gpuError">
  <div id="gpuErrorMessage"></div>
  <button type="button" id="gpuReloadBtn" style="display:none;">Reload page</button>
</div>

<button type="button" id="uiToggleBtn" title="Show/hide settings (H)">☰</button>

<a id="repoLink" href="https://github.com/isghe/mandelbrot" target="_blank" rel="noopener">https://github.com/isghe/mandelbrot</a>

<div id="ui">
  <div id="uiCommon">
    <label><input type="checkbox" id="showMandelbrot" checked> Mandelbrot</label>
    <label><input type="checkbox" id="showJulia"> Julia</label>

    <button type="button" id="backBtn" disabled>Back</button>
    <button type="button" id="forwardBtn" disabled>Forward</button>
    <button type="button" id="resetBtn">Reset to initial condition</button>
    <button type="button" id="shareBtn">Copy URL</button>

    <p class="hint">Ctrl+drag: draw a selection rectangle to recenter and zoom to fit</p>
  </div>

  <div id="uiPanels">
    <fieldset id="uiMandelbrot">
      <legend>Mandelbrot</legend>
      <label>Iterations: <span id="iterLabel">256</span></label>
      <input type="range" id="iterSlider" step="0.01">

      <label>Zoom: <span id="zoomLabel">3</span></label>
      <input type="range" id="zoomSlider" step="0.01">

      <label>Palette:</label>
      <select id="paletteType">
        <option value="0">Viridis</option>
        <option value="1">Fire</option>
        <option value="2">Ocean</option>
        <option value="3">Rainbow</option>
        <option value="4" selected>Apple II</option>
      </select>

      <label><input type="checkbox" id="progressiveMode"> Progressive mode</label>
      <label><input type="checkbox" id="smoothColoring"> Smooth coloring</label>
      <label><input type="checkbox" id="gridOverlay"> Show grid</label>
      <label><input type="checkbox" id="centerMarker"> Show center marker</label>
      <label><input type="checkbox" id="juliaMarker"> Show Julia point marker</label>
    </fieldset>

    <fieldset id="uiJulia">
      <legend>Julia</legend>
      <label>Iterations: <span id="iterLabelJulia">256</span></label>
      <input type="range" id="iterSliderJulia" step="0.01">

      <label>Zoom: <span id="zoomLabelJulia">3</span></label>
      <input type="range" id="zoomSliderJulia" step="0.01">

      <label>Palette:</label>
      <select id="paletteTypeJulia">
        <option value="0">Viridis</option>
        <option value="1">Fire</option>
        <option value="2">Ocean</option>
        <option value="3">Rainbow</option>
        <option value="4" selected>Apple II</option>
      </select>

      <label><input type="checkbox" id="progressiveModeJulia"> Progressive mode</label>
      <label><input type="checkbox" id="smoothColoringJulia"> Smooth coloring</label>
      <label><input type="checkbox" id="gridOverlayJulia"> Show grid</label>
      <label><input type="checkbox" id="centerMarkerJulia"> Show center marker</label>
    </fieldset>
  </div>
</div>

<script type="module" src="src/mandelbrot.js"></script>
</body>
</html>
