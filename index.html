<!DOCTYPE html>
<!-- Copyright (c) 2026 Isidoro Ghezzi -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Real-time WebGPU Mandelbrot/Julia fractal renderer with deep zoom (double-single precision) and interactive Julia mode.">
<meta name="author" content="Isidoro Ghezzi">
<title>WebGPU Mandelbrot / Julia Fractal (deep zoom)</title>
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="assets/mandelbrot.png" type="image/png">
</head>
<body>

<canvas id="mandelbrotGfx"></canvas>
<canvas id="mandelbrotOverlay"></canvas>
<canvas id="juliaGfx"></canvas>
<canvas id="juliaOverlay"></canvas>
<div id="noVizMessage">No visualization mode selected</div>
<div id="selectionBox"></div>
<div id="gpuError">
  <div id="gpuErrorMessage"></div>
  <button type="button" id="gpuReloadBtn" style="display:none;">Reload page</button>
</div>

<button type="button" id="uiToggleBtn" title="Show/hide settings (H)">☰</button>

<div id="footer">
  <a id="repoLink" data-chrome="decorative" href="https://github.com/isghe/mandelbrot" target="_blank" rel="noopener">https://github.com/isghe/mandelbrot</a>
  <div id="motto" data-chrome="decorative"></div>
</div>

<div id="ui">
  <div id="uiCommon">
    <label><input type="checkbox" id="showMandelbrot" checked> Mandelbrot</label>
    <label><input type="checkbox" id="showJulia" checked> Julia</label>

    <button type="button" id="backBtn" disabled>Back</button>
    <button type="button" id="forwardBtn" disabled>Forward</button>
    <button type="button" id="resetBtn">Reset to initial condition</button>
    <button type="button" id="shareBtn">Copy URL</button>

    <p class="hint">Ctrl+drag: draw a selection rectangle to recenter and zoom to fit</p>
  </div>

  <div id="uiPanels">
    <fieldset id="uiMandelbrot">
      <legend>Mandelbrot</legend>
      <label>Iterations: <span id="mandelbrotIterLabel">256</span>
        <button type="button" id="mandelbrotIterMinus">-1</button>
        <button type="button" id="mandelbrotIterPlus">+1</button>
      </label>
      <input type="range" id="mandelbrotIterSlider" step="0.01">

      <label>Zoom: <span id="mandelbrotZoomLabel">3</span></label>
      <input type="range" id="mandelbrotZoomSlider" step="0.01">

      <label>Palette:</label>
      <select id="mandelbrotPaletteType"></select>

      <label>Landmarks:</label>
      <select id="mandelbrotLandmarks"></select>

      <label><input type="checkbox" id="mandelbrotProgressiveMode"> Progressive mode</label>
      <label><input type="checkbox" id="mandelbrotSmoothColoring"> Smooth coloring</label>
      <label><input type="checkbox" id="mandelbrotGridOverlay"> Show grid</label>
      <label><input type="checkbox" id="mandelbrotCenterMarker"> Show center marker</label>
      <label><input type="checkbox" id="juliaMarker"> Show Julia seed marker</label>
      <label><input type="checkbox" id="landmarksOverlay"> Show landmarks</label>
    </fieldset>

    <fieldset id="uiJulia">
      <legend>Julia</legend>
      <label>Iterations: <span id="juliaIterLabel">256</span>
        <button type="button" id="juliaIterMinus">-1</button>
        <button type="button" id="juliaIterPlus">+1</button>
      </label>
      <input type="range" id="juliaIterSlider" step="0.01">

      <label>Zoom: <span id="juliaZoomLabel">3</span></label>
      <input type="range" id="juliaZoomSlider" step="0.01">

      <label>Palette:</label>
      <select id="juliaPaletteType"></select>

      <label><input type="checkbox" id="juliaProgressiveMode"> Progressive mode</label>
      <label><input type="checkbox" id="juliaSmoothColoring"> Smooth coloring</label>
      <label><input type="checkbox" id="juliaGridOverlay"> Show grid</label>
      <label><input type="checkbox" id="juliaCenterMarker"> Show center marker</label>
    </fieldset>
  </div>
</div>

<script type="module" src="src/mandelbrot.js"></script>
</body>
</html>
